name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p site/js site/icons
          cp index.html site/index.html
          cp js/supabase-api.js site/js/supabase-api.js
          cp manifest.json site/manifest.json 2>/dev/null || true
          cp sw.js site/sw.js 2>/dev/null || true
          cp -r icons/. site/icons/ 2>/dev/null || true
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Imposta i secret SUPABASE_URL e SUPABASE_ANON_KEY"
            exit 1
          fi
          node scripts/inject-config.mjs site/index.html
          if grep -q 'CHIERICH_CONFIG_INJECT' site/index.html; then
            echo "::error::Marker config non sostituito"
            exit 1
          fi
          if [ -f site/config.js ]; then
            echo "::error::config.js non deve essere nell'artifact"
            exit 1
          fi
          ls -la site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
