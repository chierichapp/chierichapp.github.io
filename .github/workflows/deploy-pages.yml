name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p site/js site/icons
          cp index.html site/index.html
          cp js/supabase-api.js site/js/supabase-api.js
          cp manifest.json site/manifest.json 2>/dev/null || true
          cp sw.js site/sw.js 2>/dev/null || true
          cp -r icons/. site/icons/ 2>/dev/null || true
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Imposta i secret SUPABASE_URL e SUPABASE_ANON_KEY"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const cfg = {
              supabaseUrl: process.env.SUPABASE_URL,
              supabaseAnonKey: process.env.SUPABASE_ANON_KEY
            };
            const body = 'window.CHIERICH_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n';
            fs.writeFileSync('site/config.js', body);
            // sanity: must exist in the artifact that Pages serves
            if (!fs.existsSync('site/config.js')) process.exit(2);
            console.log('Wrote site/config.js (' + body.length + ' bytes)');
          "
          test -f site/config.js
          ls -la site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
