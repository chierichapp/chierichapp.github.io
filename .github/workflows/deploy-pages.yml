name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p site/js site/icons
          cp index.html site/index.html
          cp js/supabase-api.js site/js/supabase-api.js
          cp manifest.json site/manifest.json 2>/dev/null || true
          cp sw.js site/sw.js 2>/dev/null || true
          cp -r icons/. site/icons/ 2>/dev/null || true
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Imposta i secret SUPABASE_URL e SUPABASE_ANON_KEY"
            exit 1
          fi
          # Inject config inline — no config.js in repo or as a public standalone file
          node <<'NODE'
          const fs = require('fs');
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_ANON_KEY;
          if (!url || !key) process.exit(1);
          const path = 'site/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const marker = '<script src="config.js"></script>';
          if (!html.includes(marker)) {
            console.error('Marker config.js non trovato in index.html');
            process.exit(2);
          }
          const inline =
            '<script>window.CHIERICH_CONFIG=' +
            JSON.stringify({ supabaseUrl: url, supabaseAnonKey: key }) +
            ';</script>';
          html = html.replace(marker, inline);
          fs.writeFileSync(path, html);
          if (html.includes('src="config.js"') || fs.existsSync('site/config.js')) {
            console.error('config.js non deve restare nell\'artifact');
            process.exit(3);
          }
          console.log('Config iniettata inline in site/index.html');
          NODE
          ls -la site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
